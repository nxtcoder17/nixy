name: Build Nix Image

# Publishes ghcr.io/nxtcoder17/nix, built declaratively with
# dockerTools.buildLayeredImage from flake.nix (see packages.nix-image).
# On push it only ever runs on master, when flake.nix or flake.lock change;
# the nix version is whatever nixpkgs snapshot flake.lock pins.
# workflow_dispatch is kept while the pipeline is unproven (dispatch builds
# whatever branch you run it from); once verified, drop it or guard it to
# master-only (e.g. `if: github.ref != 'refs/heads/master'` no-op step).
on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    # each arch is built natively on its own runner: images built by
    # cross-compiling nixpkgs pick up a wrong eval system
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    outputs:
      # same on both matrix legs (comes from the flake.lock-pinned nixpkgs)
      nix_version: ${{ steps.nix-version.outputs.nix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: nxtcoder17/actions/setup-docker@main
        with:
          docker_registry: "ghcr.io"
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: build image (dockerTools.buildLayeredImage)
        run: |+
          nix build -L .#nix-image
          docker load < ./result

      - name: resolve nix version
        id: nix-version
        run: |+
          NIX_VERSION="$(docker run --rm nix:latest nix --version | awk '{print $NF}')"
          echo "nix_version=$NIX_VERSION" >> "$GITHUB_OUTPUT"

      - name: push image
        run: |+
          docker tag nix:latest "ghcr.io/nxtcoder17/nix:${{ steps.nix-version.outputs.nix_version }}-${{ matrix.arch }}"
          docker push "ghcr.io/nxtcoder17/nix:${{ steps.nix-version.outputs.nix_version }}-${{ matrix.arch }}"

  manifest:
    name: Publish Multi-arch Manifest
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: nxtcoder17/actions/setup-docker@main
        with:
          docker_registry: "ghcr.io"
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}

      - name: push multi-arch manifest
        env:
          NIX_VERSION: ${{ needs.build.outputs.nix_version }}
        run: |+
          set -euo pipefail

          # `latest` is nixy's docker-mode default image (NIXY_DOCKER_MODE_IMAGE);
          # nixy itself is bind-mounted into that container at /bin/nixy by the
          # docker executor, so this tag is the plain nix runtime, not the nixy image
          for tag in "$NIX_VERSION" latest; do
            docker manifest create "ghcr.io/nxtcoder17/nix:$tag" \
              --amend "ghcr.io/nxtcoder17/nix:${NIX_VERSION}-amd64" \
              --amend "ghcr.io/nxtcoder17/nix:${NIX_VERSION}-arm64"
            docker manifest push "ghcr.io/nxtcoder17/nix:$tag"
          done

      - name: print pull commands
        env:
          NIX_VERSION: ${{ needs.build.outputs.nix_version }}
        run: |+
          {
            echo "## Published image (multi-arch)"
            echo
            echo '```bash'
            echo "# nix runtime — nixy's docker-mode default image (NIXY_DOCKER_MODE_IMAGE)"
            echo "docker pull ghcr.io/nxtcoder17/nix:$NIX_VERSION"
            echo "docker pull ghcr.io/nxtcoder17/nix:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
