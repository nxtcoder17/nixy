name: Build Nixy Image

# Publishes ghcr.io/nxtcoder17/nixy (nix runtime with the nixy binary baked
# in). It follows nixy's own codebase, not the repo flake: the flake files
# only provide the builder's go toolchain (nix develop), so they are not a
# trigger — a flake-only change lands in the image the next time nixy code
# changes. The nix runtime base comes from ghcr.io/nxtcoder17/nix:latest.
on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'nixy.yml'
      - 'Runfile.yml'
      - 'Dockerfile.nixy'
      - '.dockerignore'
      - '.github/workflows/nixy-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: nxtcoder17/actions/setup-docker@main
        with:
          docker_registry: "ghcr.io"
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}

      - uses: nxtcoder17/actions/metadata@main
        id: meta

      - name: build and push image
        run: |+
          docker buildx build -f ./Dockerfile.nixy \
            --build-arg VERSION="${{ steps.meta.outputs.version }}" \
            --tag "ghcr.io/nxtcoder17/nixy:${{ steps.meta.outputs.sanitized_ref }}-${{ matrix.arch }}" \
            --cache-to type=registry,ref="ghcr.io/nxtcoder17/nixy:buildx-cache-${{ matrix.arch }}",mode=max,compression=zstd,compression-level=13,force-compression=true \
            --cache-from type=registry,ref="ghcr.io/nxtcoder17/nixy:buildx-cache-${{ matrix.arch }}" \
            --push \
            .

  manifest:
    name: Publish Multi-arch Manifest
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: nxtcoder17/actions/setup-docker@main
        with:
          docker_registry: "ghcr.io"
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}

      - uses: nxtcoder17/actions/metadata@main
        id: meta

      - name: push multi-arch manifest
        env:
          NIXY_VERSION: ${{ steps.meta.outputs.sanitized_ref }}
        run: |+
          set -euo pipefail

          for tag in "$NIXY_VERSION" latest; do
            docker manifest create "ghcr.io/nxtcoder17/nixy:$tag" \
              --amend "ghcr.io/nxtcoder17/nixy:${NIXY_VERSION}-amd64" \
              --amend "ghcr.io/nxtcoder17/nixy:${NIXY_VERSION}-arm64"
            docker manifest push "ghcr.io/nxtcoder17/nixy:$tag"
          done

      - name: print pull commands
        env:
          NIXY_VERSION: ${{ steps.meta.outputs.sanitized_ref }}
        run: |+
          {
            echo "## Published image (multi-arch)"
            echo
            echo '```bash'
            echo "# nix runtime with the nixy binary baked in"
            echo "docker pull ghcr.io/nxtcoder17/nixy:$NIXY_VERSION"
            echo "docker pull ghcr.io/nxtcoder17/nixy:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
